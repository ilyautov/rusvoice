name: Publish to PyPI

# На каждый тег v*: собрать sdist+wheel и опубликовать на PyPI через Trusted
# Publishing (OIDC — токена в репозитории НЕТ и не нужно).
#
# Разовая настройка на стороне PyPI (в веб-интерфейсе, ДО первого тега):
#   Account → Publishing → Add a pending publisher
#     PyPI Project Name: rusvoice
#     Owner:             ilyautov
#     Repository name:   rusvoice
#     Workflow name:     publish-pypi.yml   <-- должно совпадать с именем ЭТОГО файла
#     Environment name:  pypi
# Pending publisher становится постоянным после первого успешного запуска.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rusvoice
    permissions:
      id-token: write # обязательно для Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
      # Метаданные ломаются молча: readme с битой разметкой PyPI примет, а страница
      # окажется пустой. Проверяем ДО загрузки — она необратима.
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
